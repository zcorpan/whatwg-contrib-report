name: WHATWG contribution report

on:
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Ignore cache and rescan all history"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: whatwg-contrib-report-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/whatwg_contrib_report.py \
            ${{ inputs.full_scan && '--full-scan' || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish gh-pages branch
        run: |
          git fetch origin gh-pages || true
          git switch --orphan gh-pages-tmp
          cp -R site/. .
          touch .nojekyll
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update report" || exit 0
          git branch -M gh-pages
          git push -f origin gh-pages
